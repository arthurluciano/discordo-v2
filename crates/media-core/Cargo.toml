[package]
name = "media-core"
version = "0.1.0"
edition = "2024"
description = "Discordo's native media engine: WebRTC transport, capture, GPU encode/decode."
publish = false

[lib]
# cdylib: the DLL the Windows app loads. rlib: so tests can link the same code.
crate-type = ["cdylib", "rlib"]

# The WebRTC stack. Its crypto backend differs per platform: Windows' own (CNG) on Windows, so the
# DLL needs no C toolchain or OpenSSL to build; a Rust one elsewhere, which is what tests run on.
[target.'cfg(windows)'.dependencies]
str0m = { version = "0.25", default-features = false, features = ["wincrypto"] }

[target.'cfg(not(windows))'.dependencies]
str0m = { version = "0.25", default-features = false, features = ["rust-crypto"] }

[dev-dependencies]
serde_json = "1"
