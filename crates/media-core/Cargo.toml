[package]
name = "media-core"
version = "0.1.0"
edition = "2024"
description = "Discordo's native media engine: WebRTC transport, capture, GPU encode/decode."
publish = false

[lib]
# cdylib: the DLL the Windows app loads. rlib: so tests can link the same code.
crate-type = ["cdylib", "rlib"]

# The WebRTC stack. Its crypto backend differs per platform: Windows' own (CNG) on Windows, so the
# DLL needs no C toolchain or OpenSSL to build; a Rust one elsewhere, which is what tests run on.
[target.'cfg(windows)'.dependencies]
str0m = { version = "0.25", default-features = false, features = ["wincrypto"] }
windows = { version = "0.61", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }

[target.'cfg(not(windows))'.dependencies]
str0m = { version = "0.25", default-features = false, features = ["rust-crypto"] }

[dependencies]
serde_json = "1"
# libopus, built from source by CMake (on Windows: the "C++ CMake tools" component of Visual Studio).
opus = { version = "0.4", optional = true }

[features]
default = ["opus"]
# Without it the crate still builds, with a codec that only produces silence. That exists so the
# Windows code can be type-checked on machines without a C toolchain: `--no-default-features`.
opus = ["dep:opus"]
