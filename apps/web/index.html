<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1e1f22" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Discordo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // Paints the stored skin and mode before the first frame; mirrors SKINS in components/theme-provider.tsx.
      ;(() => {
        const read = (key) => {
          try {
            return window.localStorage.getItem(key)
          } catch {
            return null // Restricted webviews: fall back to the defaults.
          }
        }
        const prefers = (query) => window.matchMedia(query).matches
        const themeColors = {
          default: { dark: '#1e1f22' },
          glass: { dark: '#0b0c1a', light: '#eef0f8' },
          midnight: { dark: '#000000' },
          forest: { dark: '#0f1a15' },
          ocean: { dark: '#0b1724' },
          dusk: { dark: '#1b1220' },
          paper: { light: '#e3e5e8' },
          neon: { dark: '#05040c' },
          dragon: { dark: '#0b0505' },
        }
        const storedSkin = read('discordo-skin')
        const skin = Object.hasOwn(themeColors, storedSkin) ? storedSkin : 'default'
        const stored = read('discordo-theme')
        const wanted =
          stored === 'light' || stored === 'dark' ? stored : prefers('(prefers-color-scheme: dark)') ? 'dark' : 'light'
        const resolved = themeColors[skin][wanted] ? wanted : Object.keys(themeColors[skin])[0]
        const root = document.documentElement
        root.dataset.skin = skin
        root.dataset.theme = resolved
        root.classList.toggle('dark', resolved === 'dark')
        if (read('discordo-reduce-transparency') === 'true' || prefers('(prefers-reduced-transparency: reduce)'))
          root.dataset.transparency = 'reduced'
        if (read('discordo-reduce-motion') === 'true' || prefers('(prefers-reduced-motion: reduce)'))
          root.dataset.motion = 'reduced'
        document.querySelector('meta[name="theme-color"]').content = themeColors[skin][resolved]
      })()
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Discordo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
