name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: discordo
          POSTGRES_PASSWORD: discordo
          POSTGRES_DB: discordo_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U discordo" --health-interval 2s --health-retries 30
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
      # A step, not a service: service containers cannot be given the "server /data" command.
      - run: docker run -d -p 9000:9000 -e MINIO_ROOT_USER=discordo -e MINIO_ROOT_PASSWORD=discordo-secret cgr.dev/chainguard/minio:latest server /data
      - run: go vet ./...
      - run: go test -race -p 1 ./...
        env:
          TEST_DATABASE_URL: postgres://discordo:discordo@localhost:5432/discordo_test
          TEST_S3_ENDPOINT: localhost:9000

  media-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5 # the interop test runs the real SFU
        with:
          go-version-file: apps/server/go.mod
      - run: cargo test
        working-directory: crates/media-core

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-go@v5 # the engine's interop test runs the real SFU
        with:
          go-version-file: apps/server/go.mod
      # On Windows the engine uses the system's own crypto, so this is the only place that path is tested.
      - run: cargo test
        working-directory: crates/media-core
      # Building the app project also builds Discordo.Core and the Rust media engine (cargo and CMake come with the runner).
      - run: dotnet build apps/windows/Discordo.App/Discordo.App.csproj -c Release -p:Platform=x64
      - uses: actions/upload-artifact@v4
        with:
          name: discordo-windows-x64
          path: apps/windows/Discordo.App/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/
          if-no-files-found: error
